# Docker Compose — 多 Agent 协作求职助手后端
#
# 使用前：
#   1. 复制 .env.example 为 .env
#   2. 在 .env 中填入 DEEPSEEK_API_KEY
#   3. 执行 docker compose up -d

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-job-assistant-backend
    ports:
      - "8000:8000"
    environment:
      # 必填：DeepSeek API 密钥，从宿主机 .env 注入
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?请在 .env 中设置 DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DATABASE_URL: sqlite:///./data/app.db
      APP_ENV: ${APP_ENV:-production}
    env_file:
      - .env
    volumes:
      # SQLite 数据持久化到宿主机 ./data 目录
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
