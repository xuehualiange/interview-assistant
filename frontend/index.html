<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 求职助手 · 多 Agent 协作</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* ===== GitHub Dark 设计令牌 ===== */
    :root {
      --bg-base: #0d1117;
      --bg-surface: #161b22;
      --bg-elevated: #21262d;
      --bg-hover: #30363d;
      --border: #30363d;
      --border-muted: #21262d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #6e7681;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --danger: #f85149;
      --success: #3fb950;
      --warning: #d29922;
      --purple: #a371f7;
      --user-bubble: #1c3a5e;
      --ai-bubble: #21262d;
      --sidebar-w: 280px;
      --header-h: 52px;
      --input-min-h: 52px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", Helvetica, Arial, sans-serif;
      --mono: "SF Mono", "Cascadia Code", "Fira Code", Consolas, monospace;
      --radius: 10px;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: var(--font);
      background: var(--bg-base);
      color: var(--text-primary);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== 布局 ===== */
    .app {
      display: flex;
      height: 100vh;
      width: 100%;
    }

    /* ===== 侧边栏 ===== */
    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, margin 0.25s ease;
      z-index: 100;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .brand-text {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .btn-new {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-new:hover {
      background: var(--bg-hover);
      border-color: var(--text-muted);
    }

    .session-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .session-list::-webkit-scrollbar { width: 4px; }
    .session-list::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 4px; }

    .session-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      transition: background 0.12s;
      group: session;
    }

    .session-item:hover { background: var(--bg-elevated); }
    .session-item.active { background: var(--bg-hover); }

    .session-info { flex: 1; min-width: 0; }

    .session-title {
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
    }

    .session-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .session-delete {
      opacity: 0;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      font-size: 14px;
      line-height: 1;
      flex-shrink: 0;
    }

    .session-item:hover .session-delete { opacity: 1; }
    .session-delete:hover { color: var(--danger); background: rgba(248, 81, 73, 0.1); }

    .sidebar-empty {
      padding: 24px 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
    }

    .status-dot.online { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .status-dot.offline { background: var(--danger); }

    /* ===== 主区域 ===== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg-base);
    }

    /* ===== 顶部 Agent 状态栏 ===== */
    .status-bar {
      height: var(--header-h);
      min-height: var(--header-h);
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-surface);
      display: flex;
      align-items: center;
      gap: 12px;
      overflow-x: auto;
    }

    .status-bar::-webkit-scrollbar { height: 0; }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      font-size: 18px;
    }

    .menu-toggle:hover { background: var(--bg-elevated); color: var(--text-primary); }

    .agent-flow {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .agent-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid transparent;
      white-space: nowrap;
      transition: all 0.3s ease;
      opacity: 0.5;
    }

    .agent-pill.active {
      opacity: 1;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.3);
    }

    .agent-pill.triage { background: rgba(163, 113, 247, 0.15); color: var(--purple); border-color: rgba(163, 113, 247, 0.3); }
    .agent-pill.interview_prep { background: rgba(63, 185, 80, 0.15); color: var(--success); border-color: rgba(63, 185, 80, 0.3); }
    .agent-pill.mock_interview { background: rgba(210, 153, 34, 0.15); color: var(--warning); border-color: rgba(210, 153, 34, 0.3); }
    .agent-pill.resume_opt { background: rgba(88, 166, 255, 0.15); color: var(--accent); border-color: rgba(88, 166, 255, 0.3); }

    .flow-arrow {
      color: var(--text-muted);
      font-size: 14px;
      flex-shrink: 0;
    }

    .status-idle {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* ===== 聊天区 ===== */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .chat-area::-webkit-scrollbar { width: 6px; }
    .chat-area::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 6px; }

    .messages {
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 20px 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .welcome {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .welcome h2 {
      font-size: 22px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
      letter-spacing: -0.03em;
    }

    .welcome p { font-size: 14px; line-height: 1.7; margin-bottom: 28px; }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .quick-btn {
      padding: 10px 16px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .quick-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(88, 166, 255, 0.06);
    }

    /* ===== 消息气泡 ===== */
    .msg-row {
      display: flex;
      gap: 12px;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .msg-row.user .msg-avatar { background: var(--user-bubble); }
    .msg-row.assistant .msg-avatar { background: var(--bg-elevated); border: 1px solid var(--border); }

    .msg-body { max-width: calc(100% - 44px); min-width: 0; }

    .msg-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .msg-row.user .msg-meta { justify-content: flex-end; }

    .agent-tag {
      padding: 1px 7px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 500;
    }

    .agent-tag.interview_prep { background: rgba(63,185,80,0.15); color: var(--success); }
    .agent-tag.mock_interview { background: rgba(210,153,34,0.15); color: var(--warning); }
    .agent-tag.resume_opt { background: rgba(88,166,255,0.15); color: var(--accent); }

    .msg-bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.7;
      word-break: break-word;
    }

    .msg-row.user .msg-bubble {
      background: var(--user-bubble);
      border: 1px solid rgba(88, 166, 255, 0.2);
      border-bottom-right-radius: 4px;
    }

    .msg-row.assistant .msg-bubble {
      background: var(--ai-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    /* Markdown 渲染 */
    .msg-bubble p { margin-bottom: 0.6em; }
    .msg-bubble p:last-child { margin-bottom: 0; }
    .msg-bubble ul, .msg-bubble ol { padding-left: 1.4em; margin-bottom: 0.6em; }
    .msg-bubble li { margin-bottom: 0.25em; }
    .msg-bubble strong { color: var(--text-primary); font-weight: 600; }
    .msg-bubble code {
      font-family: var(--mono);
      font-size: 0.875em;
      background: rgba(110, 118, 129, 0.2);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .msg-bubble pre {
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      overflow-x: auto;
      margin: 0.6em 0;
    }
    .msg-bubble pre code {
      background: none;
      padding: 0;
      font-size: 13px;
      line-height: 1.5;
    }
    .msg-bubble blockquote {
      border-left: 3px solid var(--border);
      padding-left: 12px;
      color: var(--text-secondary);
      margin: 0.6em 0;
    }
    .msg-bubble h1, .msg-bubble h2, .msg-bubble h3 {
      font-size: 1em;
      font-weight: 600;
      margin: 0.8em 0 0.4em;
    }

    /* 打字机光标 */
    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--accent);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 0.8s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* ===== 输入区 ===== */
    .input-area {
      padding: 16px 20px 20px;
      background: var(--bg-base);
      border-top: 1px solid var(--border);
    }

    .input-wrapper {
      max-width: 820px;
      margin: 0 auto;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 12px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .input-wrapper:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.12);
    }

    .input-wrapper.disabled { opacity: 0.6; pointer-events: none; }

    #userInput {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      max-height: 200px;
      min-height: 24px;
      overflow-y: auto;
    }

    #userInput::placeholder { color: var(--text-muted); }

    .btn-send {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-send:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-send:active:not(:disabled) { transform: scale(0.95); }
    .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

    .input-hint {
      max-width: 820px;
      margin: 8px auto 0;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
    }

    /* ===== 离线横幅 ===== */
    .offline-banner {
      background: rgba(248, 81, 73, 0.12);
      border-bottom: 1px solid rgba(248, 81, 73, 0.3);
      color: #ff7b72;
      padding: 10px 20px;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    .offline-banner.show { display: block; }

    /* ===== Toast ===== */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 10px 20px;
      border-radius: var(--radius);
      font-size: 13px;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 1000;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ===== 响应式 ===== */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        transform: translateX(-100%);
        box-shadow: var(--shadow);
      }

      .sidebar.open { transform: translateX(0); }

      .menu-toggle { display: flex; }

      .overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 99;
      }

      .overlay.show { display: block; }

      .messages { padding: 16px 12px 24px; }
      .input-area { padding: 12px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-icon">🚀</div>
          <div>
            <div class="brand-text">AI 求职助手</div>
            <div class="brand-sub">Multi-Agent 协作系统</div>
          </div>
        </div>
        <button class="btn-new" id="btnNewSession">
          <span>＋</span> 新建会话
        </button>
      </div>
      <div class="session-list" id="sessionList"></div>
      <div class="sidebar-footer">
        <span class="status-dot" id="backendDot"></span>
        <span id="backendStatus">检测后端连接...</span>
      </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <!-- 主区域 -->
    <main class="main">
      <div class="offline-banner" id="offlineBanner">
        ⚠️ 无法连接后端服务（<span id="offlineApiBase"></span>）。请确认 FastAPI 已启动：<code>uvicorn app.main:app --reload</code>
      </div>

      <!-- Agent 状态栏 -->
      <header class="status-bar">
        <button class="menu-toggle" id="menuToggle" title="菜单">☰</button>
        <div class="agent-flow" id="agentFlow">
          <span class="status-idle">等待对话开始...</span>
        </div>
      </header>

      <!-- 聊天区 -->
      <div class="chat-area" id="chatArea">
        <div class="messages" id="messages">
          <div class="welcome" id="welcome">
            <h2>有什么可以帮您的？</h2>
            <p>智能路由至面试准备、模拟面试或简历优化专家<br>由 DeepSeek 驱动，SSE 流式响应</p>
            <div class="quick-actions">
              <button class="quick-btn" data-prompt="帮我制定一份前端工程师的面试准备计划">📋 面试准备计划</button>
              <button class="quick-btn" data-prompt="开始一场30分钟的技术模拟面试">🎯 模拟技术面</button>
              <button class="quick-btn" data-prompt="帮我优化简历中的项目描述">📄 简历优化</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 输入区 -->
      <footer class="input-area">
        <div class="input-wrapper" id="inputWrapper">
          <textarea
            id="userInput"
            placeholder="输入您的问题... (Enter 发送，Shift+Enter 换行)"
            rows="1"
          ></textarea>
          <button class="btn-send" id="btnSend" title="发送">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
        <div class="input-hint">Enter 发送 · Shift+Enter 换行 · 会话数据保存在本地与 SQLite</div>
      </footer>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /* ============================================================
     * 配置
     * ============================================================ */
    const API_BASE = ['localhost', '127.0.0.1'].includes(window.location.hostname)
      ? 'http://localhost:8000'
      : 'https://interview-assistant-production.up.railway.app';
    const STORAGE_KEY = 'ai_job_assistant_sessions';

    const AGENT_META = {
      triage:           { label: 'Triage 路由',   icon: '⚡', cls: 'triage' },
      interview_prep:   { label: '面试准备专家', icon: '📋', cls: 'interview_prep' },
      mock_interview:   { label: '模拟面试官',   icon: '🎯', cls: 'mock_interview' },
      resume_opt:       { label: '简历优化专家', icon: '📄', cls: 'resume_opt' },
    };

    /* ============================================================
     * Marked 配置
     * ============================================================ */
    marked.setOptions({
      breaks: true,
      gfm: true,
    });

    function renderMarkdown(text) {
      try {
        return marked.parse(text || '');
      } catch {
        return escapeHtml(text || '');
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    /* ============================================================
     * 状态
     * ============================================================ */
    let state = {
      sessions: [],
      currentId: null,
      isStreaming: false,
      backendOnline: false,
    };

    /* ============================================================
     * DOM 引用
     * ============================================================ */
    const $ = (sel) => document.querySelector(sel);
    const sessionList   = $('#sessionList');
    const messages      = $('#messages');
    const welcome       = $('#welcome');
    const userInput     = $('#userInput');
    const btnSend       = $('#btnSend');
    const btnNewSession = $('#btnNewSession');
    const inputWrapper  = $('#inputWrapper');
    const agentFlow     = $('#agentFlow');
    const chatArea      = $('#chatArea');
    const backendDot    = $('#backendDot');
    const backendStatus = $('#backendStatus');
    const offlineBanner = $('#offlineBanner');
    const sidebar       = $('#sidebar');
    const overlay       = $('#overlay');
    const menuToggle    = $('#menuToggle');
    const toast         = $('#toast');

    /* ============================================================
     * 本地存储：会话列表
     * ============================================================ */
    function loadSessions() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const data = JSON.parse(raw);
          state.sessions = data.sessions || [];
          state.currentId = data.currentId || null;
        }
      } catch { state.sessions = []; }

      if (state.sessions.length === 0) {
        createSession(false);
      } else if (!state.currentId || !state.sessions.find(s => s.id === state.currentId)) {
        state.currentId = state.sessions[0].id;
      }
      saveSessions();
    }

    function saveSessions() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        sessions: state.sessions,
        currentId: state.currentId,
      }));
    }

    function generateId() {
      return 'sess-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    function createSession(switchTo = true) {
      const id = generateId();
      const session = {
        id,
        title: '新对话',
        updatedAt: new Date().toISOString(),
      };
      state.sessions.unshift(session);
      if (switchTo) state.currentId = id;
      saveSessions();
      renderSessionList();
      if (switchTo) switchSession(id);
      return id;
    }

    function updateSessionTitle(id, text) {
      const s = state.sessions.find(s => s.id === id);
      if (s && s.title === '新对话') {
        s.title = text.slice(0, 30) + (text.length > 30 ? '...' : '');
        s.updatedAt = new Date().toISOString();
        saveSessions();
        renderSessionList();
      }
    }

    function touchSession(id) {
      const s = state.sessions.find(s => s.id === id);
      if (s) {
        s.updatedAt = new Date().toISOString();
        state.sessions.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
        saveSessions();
        renderSessionList();
      }
    }

    /* ============================================================
     * 会话列表渲染
     * ============================================================ */
    function renderSessionList() {
      if (state.sessions.length === 0) {
        sessionList.innerHTML = '<div class="sidebar-empty">暂无会话<br>点击上方按钮开始</div>';
        return;
      }

      sessionList.innerHTML = state.sessions.map(s => {
        const date = formatRelativeTime(s.updatedAt);
        const active = s.id === state.currentId ? 'active' : '';
        return `
          <div class="session-item ${active}" data-id="${s.id}">
            <div class="session-info">
              <div class="session-title">${escapeHtml(s.title)}</div>
              <div class="session-meta">${date}</div>
            </div>
            <button class="session-delete" data-id="${s.id}" title="删除">×</button>
          </div>`;
      }).join('');

      sessionList.querySelectorAll('.session-item').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.classList.contains('session-delete')) return;
          switchSession(el.dataset.id);
          closeSidebar();
        });
      });

      sessionList.querySelectorAll('.session-delete').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          await deleteSession(btn.dataset.id);
        });
      });
    }

    function formatRelativeTime(iso) {
      const diff = Date.now() - new Date(iso).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return '刚刚';
      if (mins < 60) return `${mins} 分钟前`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs} 小时前`;
      return new Date(iso).toLocaleDateString('zh-CN');
    }

    /* ============================================================
     * 切换 / 删除会话
     * ============================================================ */
    async function switchSession(id) {
      if (state.isStreaming) return;
      state.currentId = id;
      saveSessions();
      renderSessionList();
      resetAgentFlow();
      await loadHistory(id);
    }

    async function loadHistory(sessionId) {
      messages.innerHTML = '';
      welcome.style.display = 'none';

      try {
        const res = await fetch(`${API_BASE}/history/${sessionId}`);
        if (!res.ok) {
          showWelcomeIfEmpty();
          return;
        }
        const data = await res.json();
        if (data.messages.length === 0) {
          showWelcomeIfEmpty();
          return;
        }
        data.messages.forEach(msg => {
          appendMessage(msg.role, msg.content, msg.agent_type, false);
        });
        scrollToBottom();
      } catch {
        showWelcomeIfEmpty();
      }
    }

    function showWelcomeIfEmpty() {
      messages.innerHTML = '';
      messages.appendChild(welcome);
      welcome.style.display = 'block';
    }

    async function deleteSession(id) {
      if (!confirm('确定删除此会话？对话记录将从服务器清除。')) return;

      try {
        await fetch(`${API_BASE}/session/${id}`, { method: 'DELETE' });
      } catch { /* 后端离线时仍删除本地 */ }

      state.sessions = state.sessions.filter(s => s.id !== id);

      if (state.currentId === id) {
        if (state.sessions.length === 0) {
          createSession(true);
        } else {
          switchSession(state.sessions[0].id);
        }
      } else {
        saveSessions();
        renderSessionList();
      }
      showToast('会话已删除');
    }

    /* ============================================================
     * Agent 状态栏
     * ============================================================ */
    function resetAgentFlow() {
      agentFlow.innerHTML = '<span class="status-idle">等待对话开始...</span>';
    }

    function showAgentFlow(agentKey, isRouting = false) {
      const triage = AGENT_META.triage;
      const agent = AGENT_META[agentKey] || AGENT_META.interview_prep;

      agentFlow.innerHTML = `
        <span class="agent-pill triage ${isRouting ? 'active' : ''}">${triage.icon} ${triage.label}</span>
        <span class="flow-arrow">→</span>
        <span class="agent-pill ${agent.cls} active">${agent.icon} ${agent.label}</span>
      `;
    }

    function showRoutingAnimation() {
      agentFlow.innerHTML = `
        <span class="agent-pill triage active">${AGENT_META.triage.icon} ${AGENT_META.triage.label}</span>
        <span class="flow-arrow">→</span>
        <span class="status-idle">识别意图中...</span>
      `;
    }

    /* ============================================================
     * 消息渲染
     * ============================================================ */
    function appendMessage(role, content, agentType = null, animate = true) {
      if (welcome.parentNode === messages) welcome.style.display = 'none';

      const row = document.createElement('div');
      row.className = `msg-row ${role}${animate ? '' : ''}`;

      const avatar = role === 'user' ? '👤' : (AGENT_META[agentType]?.icon || '🤖');
      const agentLabel = agentType && AGENT_META[agentType]
        ? `<span class="agent-tag ${agentType}">${AGENT_META[agentType].label}</span>`
        : '';

      row.innerHTML = `
        <div class="msg-avatar">${avatar}</div>
        <div class="msg-body">
          <div class="msg-meta">
            ${role === 'user' ? '您' : 'AI 助手'} ${agentLabel}
          </div>
          <div class="msg-bubble">${role === 'assistant' ? renderMarkdown(content) : escapeHtml(content).replace(/\n/g, '<br>')}</div>
        </div>`;

      messages.appendChild(row);
      scrollToBottom();
      return row.querySelector('.msg-bubble');
    }

    function createStreamingBubble(agentType) {
      if (welcome.parentNode === messages) welcome.style.display = 'none';

      const row = document.createElement('div');
      row.className = 'msg-row assistant';
      row.id = 'streamingRow';

      const icon = AGENT_META[agentType]?.icon || '🤖';
      const label = agentType && AGENT_META[agentType]
        ? `<span class="agent-tag ${agentType}">${AGENT_META[agentType].label}</span>`
        : '';

      row.innerHTML = `
        <div class="msg-avatar">${icon}</div>
        <div class="msg-body">
          <div class="msg-meta">AI 助手 ${label}</div>
          <div class="msg-bubble" id="streamingBubble"><span class="typing-cursor"></span></div>
        </div>`;

      messages.appendChild(row);
      scrollToBottom();
      return $('#streamingBubble');
    }

    function updateStreamingBubble(bubble, text, showCursor = true) {
      bubble.innerHTML = renderMarkdown(text) + (showCursor ? '<span class="typing-cursor"></span>' : '');
      scrollToBottom();
    }

    function finalizeStreamingBubble(bubble, text) {
      bubble.innerHTML = renderMarkdown(text);
      const row = $('#streamingRow');
      if (row) row.removeAttribute('id');
      bubble.removeAttribute('id');
    }

    function scrollToBottom() {
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    /* ============================================================
     * SSE 流式对话（fetch + ReadableStream）
     * ============================================================ */
    async function streamChat(message, sessionId, callbacks) {
      const response = await fetch(`${API_BASE}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, session_id: sessionId }),
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split('\n');
        buffer = parts.pop();

        for (const line of parts) {
          const trimmed = line.trim();
          if (!trimmed.startsWith('data:')) continue;
          const jsonStr = trimmed.slice(5).trim();
          if (!jsonStr) continue;
          try {
            const event = JSON.parse(jsonStr);
            callbacks.onEvent(event);
          } catch (e) {
            console.warn('SSE 解析失败:', jsonStr, e);
          }
        }
      }

      // 处理 buffer 残余
      if (buffer.trim().startsWith('data:')) {
        try {
          const event = JSON.parse(buffer.trim().slice(5).trim());
          callbacks.onEvent(event);
        } catch { /* ignore */ }
      }
    }

    /* ============================================================
     * 发送消息
     * ============================================================ */
    async function sendMessage(text) {
      text = text.trim();
      if (!text || state.isStreaming) return;

      if (!state.backendOnline) {
        showToast('后端未连接，请先启动 FastAPI 服务');
        return;
      }

      if (!state.currentId) createSession(true);

      const sessionId = state.currentId;
      updateSessionTitle(sessionId, text);
      touchSession(sessionId);

      appendMessage('user', text);
      userInput.value = '';
      autoResizeInput();
      setStreaming(true);
      showRoutingAnimation();

      let fullText = '';
      let currentAgent = null;
      let bubble = null;

      try {
        await streamChat(text, sessionId, {
          onEvent(event) {
            switch (event.type) {
              case 'triage': {
                let info = {};
                try { info = JSON.parse(event.content); } catch { /* ignore */ }
                currentAgent = info.agent || 'interview_prep';
                showAgentFlow(currentAgent);
                bubble = createStreamingBubble(currentAgent);
                break;
              }
              case 'chunk':
                fullText += event.content;
                if (!bubble) {
                  bubble = createStreamingBubble(currentAgent || 'interview_prep');
                }
                updateStreamingBubble(bubble, fullText, true);
                break;
              case 'end':
                if (bubble) {
                  finalizeStreamingBubble(bubble, fullText);
                }
                break;
            }
          },
        });

        // 若未收到 end 事件，仍 finalize
        if (bubble && bubble.id === 'streamingBubble') {
          finalizeStreamingBubble(bubble, fullText);
        }
      } catch (err) {
        console.error(err);
        const errMsg = '⚠️ 请求失败：' + (err.message || '未知错误') + '\n\n请确认后端服务已在 ' + API_BASE + ' 运行。';
        if (bubble) {
          finalizeStreamingBubble(bubble, errMsg);
        } else {
          appendMessage('assistant', errMsg);
        }
        checkBackend();
      } finally {
        setStreaming(false);
      }
    }

    function setStreaming(v) {
      state.isStreaming = v;
      btnSend.disabled = v;
      inputWrapper.classList.toggle('disabled', v);
    }

    /* ============================================================
     * 后端健康检查
     * ============================================================ */
    async function checkBackend() {
      try {
        const res = await fetch(`${API_BASE}/health`, { signal: AbortSignal.timeout(4000) });
        if (res.ok) {
          state.backendOnline = true;
          backendDot.className = 'status-dot online';
          backendStatus.textContent = '后端已连接';
          offlineBanner.classList.remove('show');
        } else {
          throw new Error('not ok');
        }
      } catch {
        state.backendOnline = false;
        backendDot.className = 'status-dot offline';
        backendStatus.textContent = '后端未连接';
        offlineBanner.classList.add('show');
      }
    }

    /* ============================================================
     * 输入框：自动增高 + 快捷键
     * ============================================================ */
    function autoResizeInput() {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 200) + 'px';
    }

    userInput.addEventListener('input', autoResizeInput);

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(userInput.value);
      }
    });

    btnSend.addEventListener('click', () => sendMessage(userInput.value));

    /* ============================================================
     * 快捷操作
     * ============================================================ */
    document.querySelectorAll('.quick-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        userInput.value = btn.dataset.prompt;
        autoResizeInput();
        sendMessage(btn.dataset.prompt);
      });
    });

    btnNewSession.addEventListener('click', () => {
      createSession(true);
      closeSidebar();
    });

    /* ============================================================
     * 移动端侧边栏
     * ============================================================ */
    menuToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('show');
    });

    overlay.addEventListener('click', closeSidebar);

    function closeSidebar() {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    }

    /* ============================================================
     * Toast
     * ============================================================ */
    let toastTimer;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
    }

    /* ============================================================
     * 初始化
     * ============================================================ */
    $('#offlineApiBase').textContent = API_BASE;
    loadSessions();
    renderSessionList();
    if (state.currentId) loadHistory(state.currentId);
    checkBackend();
    setInterval(checkBackend, 30000);
    userInput.focus();
  </script>
</body>
</html>
